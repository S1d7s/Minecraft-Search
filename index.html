<!DOCTYPE html>
<html lang="pt-br" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minecraft Search</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- NAVBAR -->
    <nav class="navbar">
        <div class="nav-container">
            <div class="nav-logo">
                <div class="logo-icon"></div>
                <span class="nav-brand">Minecraft Search</span>
            </div>
            <div class="nav-actions">
                <button class="theme-toggle" id="themeToggle" aria-label="Alternar tema">
                    <span class="theme-icon">🌙</span>
                </button>
                <a href="https://github.com/S1d7s/minecraft-search" target="_blank" class="github-link">
                    <svg viewBox="0 0 16 16" width="20" height="20">
                        <path fill="currentColor" d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"/>
                    </svg>
                </a>
            </div>
        </div>
    </nav>

    <!-- AVISO LEGAL -->
    <div class="aviso-legal">
        ⚠️ NÃO É UM PRODUTO OFICIAL DA MINECRAFT - Projeto de fã
    </div>

    <!-- CONTEÚDO PRINCIPAL -->
    <main>
        <div class="container">
            <!-- LOGO -->
            <div class="logo-container">
                <div class="logo-main"></div>
            </div>

            <!-- BARRA DE BUSCA -->
            <div class="search-container">
                <div class="input-wrapper">
                    <div class="search-icon"></div>
                    <input type="text" id="busca" placeholder="Pesquise algo..." autocomplete="off">
                    <button class="clear-btn" id="clearBtn" aria-label="Limpar">✕</button>
                </div>
                
                <div id="resultados"></div>
                
                <!-- MENSAGEM INICIAL -->
                <div id="mensagem-inicial" class="mensagem-inicial">
                    <div class="empty-state">
                        <div class="empty-icon">🔍</div>
                        <p>Digite algo para pesquisar</p>
                        <small>Exemplo: diamante, creeper, nether...</small>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- RODAPÉ -->
    <footer>
        <div class="footer-content">
            <p>© 2026 <strong>S1d7s</strong> - Feito com ❤️ pela comunidade</p>
            <div class="footer-links">
                <a href="readme.md">Sobre</a>
                <a href="license.md">Licença MIT</a>
            </div>
        </div>
    </footer>

    <script src="script.js"></script>
</body>
                                                </html>
